<section id="hero" class="hero">
  <div class="hero__bg">
    <div class="hero__glow hero__glow--1"></div>
    <div class="hero__glow hero__glow--2"></div>
    <div class="hero__grid"></div>
  </div>

  <div class="hero__content container">
    <p class="hero__greeting">{{ texts().greeting }}</p>
    <h1 class="hero__name">{{ texts().name }}</h1>
    <p class="hero__role">
      <span class="role-bracket">&lt;</span>
      {{ texts().role }}
      <span class="role-bracket">/&gt;</span>
    </p>
    <p class="hero__description">{{ texts().description }}</p>
    <div class="hero__actions">
      <button class="btn-primary" (click)="goToProjects()">
        {{ texts().cta }}
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
      <button class="btn-secondary" (click)="goToAbout()">
        {{ texts().ctaSecondary }}
      </button>
    </div>
  </div>
</section>
